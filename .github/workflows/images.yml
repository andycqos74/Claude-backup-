name: Build and publish images

# Builds the server and agent images and pushes them to GHCR, so hosts can
# deploy by pulling instead of compiling. The Docker build compiles the Go
# server plus three cross-compiled agent binaries, which is enough to
# exhaust a small VPS — doing it here keeps that load off the deployment
# host entirely.

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/centralbackup-server
  AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/centralbackup-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: server
            image_env: SERVER_IMAGE
          - target: agent
            image_env: AGENT_IMAGE
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.image_env] }}
          # "latest" tracks the default branch; every branch and tag also
          # gets its own tag so a specific build can be pinned or rolled
          # back to.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
