# SNI router for the agent plane.
#
# Agents pin the SHA-256 fingerprint of their tenant's certificate, so
# nothing here may terminate TLS. ssl_preread reads the SNI hostname out of
# the ClientHello and proxy_pass splices the raw TCP stream to the matching
# tenant — the certificate the agent verifies is its own tenant's, unchanged.
#
# Load with:  nginx -c /path/to/nginx-sni.conf
# or drop the stream{} block into your existing nginx.conf.

load_module modules/ngx_stream_module.so;   # Debian/Ubuntu: libnginx-mod-stream

events {}

stream {
    log_format sni '$remote_addr [$time_local] sni="$ssl_preread_server_name" '
                   '-> $upstream_addr $status $bytes_sent';
    access_log /var/log/nginx/agent-sni.log sni;

    # Tenant routing table. One line per tenant; the provisioner regenerates
    # this file and reloads nginx (nginx -s reload, zero dropped connections).
    map $ssl_preread_server_name $tenant {
        acme.backup.example.com    acme-server:8443;
        globex.backup.example.com  globex-server:8443;

        # Fail closed. An unknown or absent SNI (an agent enrolled against a
        # bare IP sends none) must be refused, never silently routed to a
        # default tenant — that would hand one tenant's agent to another,
        # where it would fail the pin in a way that looks like corruption.
        default                    "";
    }

    server {
        listen 8443;
        ssl_preread on;
        proxy_pass $tenant;

        # Backups are long-lived uploads on a persistent control channel;
        # the default 10m timeout would cut idle agents off repeatedly.
        proxy_timeout 1h;
        proxy_connect_timeout 10s;
    }
}
