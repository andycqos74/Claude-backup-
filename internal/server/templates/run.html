{{define "content"}}
<div class="page-head">
  <h1 id="title">Run</h1>
  <span class="spacer"></span>
  <button class="btn danger" id="cancel-btn" onclick="cancelRun()" hidden>Cancel run</button>
</div>
<p id="meta" class="muted"></p>
<div class="card" id="progress-card" hidden>
  <div class="progress"><div class="progress-bar" id="pbar"></div></div>
  <p class="muted" id="ptext"></p>
</div>
<h2>Log</h2>
<pre class="code log" id="log"></pre>
<script>
const runID = document.body.dataset.id;
async function load() {
  const d = await api('GET', '/api/admin/runs/' + runID);
  const r = d.run;
  el('title').innerHTML = `${statusBadge(r.Status)} ${esc(r.job_name)} <span class="muted">(${esc(r.Mode)})</span>`;
  let meta = `Client ${esc(r.agent_name)} · created ${fmtTime(r.CreatedAt)}`;
  if (r.FinishedAt) meta += ` · finished ${fmtTime(r.FinishedAt)} · took ${fmtDuration(r)}`;
  if (r.Stats) {
    try {
      const s = JSON.parse(r.Stats);
      if (s.files_total || s.bytes_uploaded)
        meta += ` · ${s.files_total} files, ${s.files_changed} changed, ${s.files_skipped} skipped · uploaded ${fmtBytes(s.bytes_uploaded)}`;
    } catch {}
  }
  el('meta').innerHTML = meta + (r.Error ? `<br><span class="err">${esc(r.Error)}</span>` : '');

  const running = r.Status === 'running';
  const cancellable = running || r.Status === 'queued';
  el('cancel-btn').hidden = !cancellable;
  el('progress-card').hidden = !running;
  if (running && r.Progress) {
    try {
      const p = JSON.parse(r.Progress);
      const pct = p.bytes_total > 0 ? Math.min(100, 100 * p.bytes_done / p.bytes_total) : 0;
      el('pbar').style.width = pct + '%';
      el('ptext').textContent = `${p.phase}: ${p.files_done}/${p.files_total} files · ${fmtBytes(p.bytes_done)} / ${fmtBytes(p.bytes_total)}`;
    } catch {}
  }
  el('log').textContent = d.logs
    ? d.logs.map(l => `${new Date(l.TS).toISOString()} [${l.Level}] ${l.Message}`).join('\n')
    : '';
  if (cancellable) setTimeout(load, 2000);
}
async function cancelRun() {
  if (!confirm('Cancel this run? A backup in progress stops without creating a snapshot.')) return;
  try {
    await api('POST', `/api/admin/runs/${runID}/cancel`);
    toast('Cancellation requested');
    // Not an immediate load(): the run only actually stops once the agent
    // reports back, which the next poll (still scheduled, since the run is
    // still "running" right now) will pick up. Calling load() here too
    // would race that poll and can flash stale state back onto the page.
  } catch (err) { toast(err.message); }
}
load();
</script>
{{end}}
